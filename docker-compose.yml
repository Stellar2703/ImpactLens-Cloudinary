version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: impactlens-postgres
    restart: always
    environment:
      POSTGRES_USER: impactuser
      POSTGRES_PASSWORD: impactpass
      POSTGRES_DB: impactlens_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
